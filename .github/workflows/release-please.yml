name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Job-level permissions are required; repo must also allow Actions to open PRs
    # (Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests").
    # If that setting is disabled at org level, add a fine-grained PAT as RELEASE_PLEASE_TOKEN.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      release_id: ${{ needs.release-please.outputs.release_id }}
    secrets: inherit

  packaging:
    needs: [release-please, build-and-release]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/packaging.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  update-homebrew:
    needs: [release-please, build-and-release]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
