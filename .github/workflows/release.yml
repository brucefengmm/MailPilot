name: Build & Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.0.3)"
        type: string
        required: false
      release_id:
        description: "Existing GitHub release ID to upload assets to"
        type: string
        required: false
  workflow_dispatch:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - run: npm ci

      # windows-latest can inject CR (\r) into multiline repository secrets — strip before use
      - name: Normalize signing secrets
        shell: bash
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${RAW_TAURI_SIGNING_PRIVATE_KEY}" ]; then
            exit 0
          fi
          KEY=$(printf '%s' "$RAW_TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r')
          # Some editors store the whole minisign file as a single base64 line — decode when needed
          if ! printf '%s' "$KEY" | grep -q 'untrusted comment:'; then
            DECODED=$(printf '%s' "$KEY" | tr -d '\n' | base64 -d 2>/dev/null || true)
            if printf '%s' "$DECODED" | grep -q 'untrusted comment:'; then
              KEY="$DECODED"
              echo "Decoded base64-wrapped TAURI_SIGNING_PRIVATE_KEY."
            fi
          fi
          if ! printf '%s' "$KEY" | grep -q 'untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY must include minisign header lines (untrusted comment: ...)."
            echo "::error::Paste the FULL mailpilot.key — open in Notepad, Ctrl+A, Ctrl+C. Do not paste only one base64 line from the middle."
            exit 1
          fi
          if printf '%s' "$KEY" | grep -q 'encrypted secret key'; then
            echo "Signing key is password-protected (encrypted secret key)."
          fi
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<MAILPILOT_KEY_EOF'
            printf '%s' "$KEY"
            echo
            echo 'MAILPILOT_KEY_EOF'
          } >> "$GITHUB_ENV"
          if [ -n "${RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            PW=$(printf '%s' "$RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -n "$PW" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            else
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is blank — ignoring. Delete this secret if your key has no password."
            fi
          fi

      - name: Verify Tauri signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add a **Repository secret** (not Environment secret) with the full mailpilot.key contents."
            exit 1
          fi
          if ! printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | grep -q 'untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is still invalid after normalization."
            exit 1
          fi
          if printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | grep -q 'encrypted secret key' && [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::This signing key has a password. Set TAURI_SIGNING_PRIVATE_KEY_PASSWORD to the password you used in 'tauri signer generate'."
            exit 1
          fi
          echo "test" > "${RUNNER_TEMP}/tauri-sign-check.txt"
          if ! npx tauri signer sign "${RUNNER_TEMP}/tauri-sign-check.txt" -k "$TAURI_SIGNING_PRIVATE_KEY" ${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:+-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"} > /tmp/sign.out 2> /tmp/sign.err; then
            if grep -qi 'wrong password' /tmp/sign.err; then
              echo "::error::Wrong password for signing key."
              echo "::error::If you generated mailpilot.key WITHOUT a password → go to Settings → Secrets → Actions and DELETE TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
              echo "::error::If the key HAS a password → set TAURI_SIGNING_PRIVATE_KEY_PASSWORD to that exact password."
            fi
            echo "::error::Tauri signing key verification failed. Common fixes:"
            echo "::error::  1) Use Repository secrets (Settings → Secrets → Actions), not Environment secrets"
            echo "::error::  2) Paste the FULL mailpilot.key (all lines including untrusted comment headers)"
            echo "::error::  3) Passwordless key → DELETE TAURI_SIGNING_PRIVATE_KEY_PASSWORD (do not set a blank/space secret)"
            echo "::error::  4) Key with password → set TAURI_SIGNING_PRIVATE_KEY_PASSWORD to the exact password"
            echo "::error::  5) Regenerate key pair if pubkey in tauri.conf.json does not match this private key"
            sed 's/^/::error::/' /tmp/sign.err || true
            exit 1
          fi
          echo "Tauri signing secret verified."

      - name: Build and upload to existing release
        if: inputs.release_id
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ inputs.release_id }}
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

      - name: Build and create release
        if: ${{ !inputs.release_id }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "MailPilot v__VERSION__"
          releaseBody: "See the assets below to download for your platform."
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # windows-latest can inject CR (\r) into multiline repository secrets — strip before use
      - name: Normalize signing secrets
        shell: bash
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${RAW_TAURI_SIGNING_PRIVATE_KEY}" ]; then
            exit 0
          fi
          KEY=$(printf '%s' "$RAW_TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r')
          # Some editors store the whole minisign file as a single base64 line — decode when needed
          if ! printf '%s' "$KEY" | grep -q 'untrusted comment:'; then
            DECODED=$(printf '%s' "$KEY" | tr -d '\n' | base64 -d 2>/dev/null || true)
            if printf '%s' "$DECODED" | grep -q 'untrusted comment:'; then
              KEY="$DECODED"
              echo "Decoded base64-wrapped TAURI_SIGNING_PRIVATE_KEY."
            fi
          fi
          if ! printf '%s' "$KEY" | grep -q 'untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY must include minisign header lines (untrusted comment: ...)."
            echo "::error::Paste the FULL mailpilot.key — open in Notepad, Ctrl+A, Ctrl+C. Do not paste only one base64 line from the middle."
            exit 1
          fi
          if printf '%s' "$KEY" | grep -q 'encrypted secret key'; then
            echo "Signing key is password-protected (encrypted secret key)."
          fi
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<MAILPILOT_KEY_EOF'
            printf '%s' "$KEY"
            echo
            echo 'MAILPILOT_KEY_EOF'
          } >> "$GITHUB_ENV"
          if [ -n "${RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            PW=$(printf '%s' "$RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -n "$PW" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            else
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is blank — ignoring. Delete this secret if your key has no password."
            fi
          fi

      - name: Verify Tauri signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add a **Repository secret** (not Environment secret) with the full mailpilot.key contents."
            exit 1
          fi
          if ! printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | grep -q 'untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is still invalid after normalization."
            exit 1
          fi
          if printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | grep -q 'encrypted secret key' && [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::This signing key has a password. Set TAURI_SIGNING_PRIVATE_KEY_PASSWORD to the password you used in 'tauri signer generate'."
            exit 1
          fi
          echo "test" > "${RUNNER_TEMP}/tauri-sign-check.txt"
          if ! npx tauri signer sign "${RUNNER_TEMP}/tauri-sign-check.txt" -k "$TAURI_SIGNING_PRIVATE_KEY" ${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:+-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"} > /tmp/sign.out 2> /tmp/sign.err; then
            if grep -qi 'wrong password' /tmp/sign.err; then
              echo "::error::Wrong password for signing key."
              echo "::error::If you generated mailpilot.key WITHOUT a password → go to Settings → Secrets → Actions and DELETE TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
              echo "::error::If the key HAS a password → set TAURI_SIGNING_PRIVATE_KEY_PASSWORD to that exact password."
            fi
            echo "::error::Tauri signing key verification failed. Common fixes:"
            echo "::error::  1) Use Repository secrets (Settings → Secrets → Actions), not Environment secrets"
            echo "::error::  2) Paste the FULL mailpilot.key (all lines including untrusted comment headers)"
            echo "::error::  3) Passwordless key → DELETE TAURI_SIGNING_PRIVATE_KEY_PASSWORD (do not set a blank/space secret)"
            echo "::error::  4) Key with password → set TAURI_SIGNING_PRIVATE_KEY_PASSWORD to the exact password"
            echo "::error::  5) Regenerate key pair if pubkey in tauri.conf.json does not match this private key"
            sed 's/^/::error::/' /tmp/sign.err || true
            exit 1
          fi
          echo "Tauri signing secret verified."

      - name: Check if Apple signing is configured
        id: signing-check
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificate
        if: steps.signing-check.outputs.has_signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build and upload (signed + notarized)
        if: steps.signing-check.outputs.has_signing == 'true' && inputs.release_id
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ inputs.release_id }}
          updaterJsonKeepUniversal: true
          args: --target universal-apple-darwin

      - name: Build and release (signed + notarized)
        if: steps.signing-check.outputs.has_signing == 'true' && !inputs.release_id
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "MailPilot v__VERSION__"
          releaseBody: "See the assets below to download for your platform."
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
          args: --target universal-apple-darwin

      - name: Build and upload (unsigned)
        if: steps.signing-check.outputs.has_signing != 'true' && inputs.release_id
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ inputs.release_id }}
          updaterJsonKeepUniversal: true
          args: --target universal-apple-darwin

      - name: Build and release (unsigned)
        if: steps.signing-check.outputs.has_signing != 'true' && !inputs.release_id
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "MailPilot v__VERSION__"
          releaseBody: |
            See the assets below to download for your platform.

            > **macOS users**: This build is unsigned. After downloading, run:
            > ```
            > xattr -cr /Applications/MailPilot.app
            > ```
            > Or right-click the app and select "Open" on first launch.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
          args: --target universal-apple-darwin

      - name: Clean up keychain
        if: always() && steps.signing-check.outputs.has_signing == 'true'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

